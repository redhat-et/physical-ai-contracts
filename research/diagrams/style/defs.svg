<!-- Block gradient -->
<linearGradient id="block-grad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" style="stop-color:#e8edf2;stop-opacity:1"/>
  <stop offset="100%" style="stop-color:#d5dce6;stop-opacity:1"/>
</linearGradient>
