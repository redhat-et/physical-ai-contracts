<!-- Shared <defs> block for Physical AI workflow diagrams.
     Injected by build.py into each SVG's <defs> element. -->

<!-- Arrowhead markers — sized from tokens.yaml -->
<marker id="arrow" markerWidth="8" markerHeight="5.6" refX="7.2" refY="2.8" orient="auto">
  <polygon points="0 0, 8 2.8, 0 5.6" fill="#5a6a7a"/>
</marker>
<marker id="arrow-gap" markerWidth="8" markerHeight="5.6" refX="7.2" refY="2.8" orient="auto">
  <polygon points="0 0, 8 2.8, 0 5.6" fill="#c0392b"/>
</marker>
